# K1 runtime shape — HARDENED (6B-7). Internal network, no published ports.
# Canonical path: files/docker/k1/compose.yaml (see files/K1-CONTAINER-PLAN.md).
# Bind: 127.0.0.1 only (fake provider inside the container).
# Leanness: image only (`k1-app:latest`); no build section, no pull, and no
# pip/apt/npm at run time. Dependencies are baked in the image build stage.
# Runtime writes are confined to tmpfs /tmp,/run,/work,/home/k1; rootfs is
# read-only. The only writable bind is /repo/artifacts (per-run tests and
# evidence, host dir <repo>/files/quality/k1/<run_id>); /repo/base and
# /repo/head are sealed read-only git archives, never a worktree.
# /work: rw,exec (required to execute built artifacts per K1 contract).
# Compensating controls for exec (noexec dropped): internal-only network,
# read-only rootfs, cap-drop ALL + no-new-privileges, non-root uid 10001,
# tmpfs nosuid/nodev; /tmp,/run,/home/k1 remain noexec,nosuid,nodev.
#
# Scanner toolchain baked in the image (K1-DEPS, build-time installs only):
#   /opt/java/bin/java            Temurin JRE 21.0.13+9 (sha256-pinned)
#   /opt/zap/zap.sh               ZAP 2.17.0 core (sha256-pinned)
#   /usr/local/bin/zap            -> /opt/zap/zap.sh
#   /usr/local/bin/zap.sh         -> /opt/zap/zap.sh
#   /usr/local/bin/zap-baseline   non-interactive passive scan (JSON output)
#   /usr/local/bin/schemathesis   (also `st`) API schema fuzzing
#   /usr/local/bin/zizmor         workflow audit
#   /usr/local/bin/bandit         Python security scan
#   /usr/local/bin/radon          Python complexity (also importable)
# ZAP's writable home is /work/zap (ZAP_WORK_DIR); the rootfs stays read-only.
# ZAP runs with -Xmx320m, so the app limit is 768M and /work is 128m so the
# scan fits beside the app. Keep handlers.py in step.
# Exact commands gate_run.py uses (cwd = sealed tree):
#   schemathesis run <spec> --url <base_url> --max-examples N --no-color
#   zizmor <workflow.yml...> --format json
#   zap-baseline -t <target> -J <report.json> -I
#
# Pins: see image-pins.json. Offline build: --pull=false, no pull to obtain pins.
name: k1

services:
  app:
    image: k1-app:latest
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["k1-internal"]
    # No ports: key while loopback-only (never "0.0.0.0:5432"/"8081").
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0755
      - /work:rw,exec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0755
      - /home/k1:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0755
    volumes:
      - type: bind
        source: ${K1_BASE:-./repo-base}
        target: /repo/base
        read_only: true
      - type: bind
        source: ${K1_HEAD:-./repo-head}
        target: /repo/head
        read_only: true
      # Persistent per-run tests/evidence. Configs stay on tmpfs unless copied
      # here explicitly (the typed k1.up tool derives this under files/quality/k1/).
      - type: bind
        source: ${K1_ARTIFACTS:-./artifacts}
        target: /repo/artifacts
        read_only: false
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: 1.0
          pids: 256

  pg:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    read_only: true
    networks: ["k1-internal"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=96m
      # The entrypoint writes its unix socket here before dropping privileges;
      # without a writable /var/run/postgresql it fails on a fresh host.
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m
    # Disposable tmpfs data: fsync cannot make it durable, so fsync-off removes
    # the I/O cost without weakening anything the sandbox promises.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: k1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?per-run generated by harness}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5

networks:
  k1-internal:
    internal: true
    driver: bridge
